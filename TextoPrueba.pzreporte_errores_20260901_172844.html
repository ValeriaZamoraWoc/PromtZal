<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Reporte de Errores</title><style>* {    box-sizing: border-box;    margin: 0;    padding: 0;}body {    font-family: 'Segoe UI', Arial, sans-serif;    background: #322E2B;    color: #EEE4DB;    min-height: 100vh;    padding: 40px;}.contenedor {    max-width: 1200px;    margin: auto;}.encabezado {    background: #3A3431;    border: 1px solid #F0A8A9;    border-radius: 24px;    padding: 30px 35px;    margin-bottom: 25px;    box-shadow: 0 8px 25px rgba(0,0,0,0.25);}.encabezado h1 {    color: #F0A8A9;    font-size: 30px;    margin-bottom: 8px;}.encabezado p {    color: #C8BCB3;    font-size: 15px;}.icono {    font-size: 28px;    margin-right: 8px;}.tabla-contenedor {    background: #3A3431;    border: 1px solid #F0A8A9;    border-radius: 24px;    padding: 20px;    overflow-x: auto;    box-shadow: 0 8px 25px rgba(0,0,0,0.25);}table {    width: 100%;    border-collapse: separate;    border-spacing: 0;}thead th {    background: #F0A8A9;    color: #322E2B;    font-size: 14px;    font-weight: 700;    padding: 15px 18px;    text-align: left;}thead th:first-child {    border-radius: 14px 0 0 0;}thead th:last-child {    border-radius: 0 14px 0 0;}tbody td {    padding: 14px 18px;    color: #EEE4DB;    background: #403B37;    border-bottom: 1px solid #504943;    font-size: 14px;}tbody tr:hover td {    background: #4A4541;}tbody tr:last-child td {    border-bottom: none;}.numero {    color: #F0A8A9;    font-weight: 700;    width: 60px;}.lexema {    color: #9AC4D7;    font-family: Consolas, monospace;}.descripcion {    color: #EEE4DB;}.posicion {    color: #C8BCB3;}.pie {    text-align: center;    margin-top: 25px;    color: #9D928A;    font-size: 13px;}</style></head><body><div class='contenedor'><div class='encabezado'><h1><span class='icono'>✖</span>Reporte de Errores</h1><p>Errores léxicos encontrados durante el análisis del archivo.</p></div><div class='tabla-contenedor'><table><thead><tr><th>#</th><th>Lexema</th><th>Descripción</th><th>Fila</th><th>Columna</th></tr></thead><tbody><tr><td class='numero'>0</td><td class='lexema'>,</td><td class='descripcion'>Carácter no reconocido</td><td class='posicion'>29</td><td class='posicion'>18</td></tr><tr><td class='numero'>1</td><td class='lexema'>,</td><td class='descripcion'>Carácter no reconocido</td><td class='posicion'>29</td><td class='posicion'>29</td></tr></tbody></table></div><div class='pie'>Reporte generado automáticamente por el analizador léxico.</div></div></body></html>
